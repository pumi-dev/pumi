[alias]
# The dev profile: it shares what `cargo build` already compiled, where `--release` built
# pumid and pumi-host again with thin LTO, 1 to 4 minutes on each CI runner.
xtask = "run --quiet --package xtask --"
[env]
ZIG = { value = "zig", force = false }
# libghostty-vt-sys picks the Zig mode from Cargo's `DEBUG`, so a profile that keeps debug info —
# the release profile's line tables — builds the terminal engine in `Debug`: unoptimized, with
# ghostty's full-page integrity checks on every update. An existing variable still wins.
LIBGHOSTTY_VT_SYS_OPTIMIZE = { value = "ReleaseFast", force = false }

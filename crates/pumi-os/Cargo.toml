[package]
name = "pumi-os"
version = "0.47.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "The machine's functions only the OS can answer: secrets, `clipboard.*`, `fs.pick`, `fs.open`/`trash` and `process.*`; and the OS's notification centre, which the app posts messages to."
[dependencies]
pumi-sys = { path = "../pumi-sys" }
pumi-api = { path = "../pumi-api" }
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
libc = "=0.2.190"
trash = "=5.2.9"
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials"] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSSet",
    "NSString",
    "NSURL",
] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationAttachment",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

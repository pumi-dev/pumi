[package]
name = "pumi-host"
version = "0.46.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "What runs beside pumi's core: keys, menus, selection, plugins' files, settings and the system catalogue."
[lib]
path = "src/lib.rs"
[[bin]]
name = "pumi-host"
path = "src/main.rs"
[features]
default = ["core-system"]
core-system = ["dep:pumi-os"]
[dependencies]
pumi-sys = { path = "../pumi-sys" }
pumi-os = { path = "../pumi-os", optional = true }
pumi-api = { path = "../pumi-api" }
pumi-lang = { path = "../pumi-lang" }
pumi-mirror = { path = "../pumi-mirror" }
schemars = "=1.2.3"
base64 = "=0.23.1"
pumi-proto = { path = "../pumi-proto" }
pumi-keys = { path = "../pumi-keys" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
regex = "=1.13.1"
toml = "=0.8.23"
[dev-dependencies]
tempfile = "=3.27.0"

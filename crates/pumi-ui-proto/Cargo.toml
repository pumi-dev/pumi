[package]
name = "pumi-ui-proto"
version = "0.42.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "What draws pumi's window, in any language: the mutations a UI sends the renderer, the styles they set and the events it sends back. Plain data: no JS, no GPUI."
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
schemars = "=1.2.3"

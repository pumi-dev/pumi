[package]
name = "pumi-proto"
version = "0.45.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "What pumid, the pumi app and the CLI share: paths, the native protocol, and the API's vocabulary."
[dependencies]
pumi-sys = { path = "../pumi-sys" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }

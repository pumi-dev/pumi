[package]
name = "pumi-mirror"
version = "0.47.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "The core's model as pumi-host sees it: sessions, views, tabs, options and channels, read from the core (`core.model`) when its events say it moved, and the groups autocmds are made in."
[dependencies]
pumi-sys = { path = "../pumi-sys" }
pumi-api = { path = "../pumi-api" }
pumi-layout = { path = "../pumi-layout" }
pumi-model = { path = "../pumi-model" }
pumi-proto = { path = "../pumi-proto" }
schemars = "=1.2.3"
sha2 = "=0.11.1"
base64 = "=0.23.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
[dev-dependencies]
tempfile = "=3.27.0"

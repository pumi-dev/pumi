[package]
name = "pumi-layout"
version = "0.42.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "A view's split tree, its geometry in cells, and tmux's presets and layout strings: the core stores and checks the tree, the host and the app lay it out."

[dependencies]
pumi-api = { path = "../pumi-api" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.3"

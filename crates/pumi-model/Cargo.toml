[package]
name = "pumi-model"
version = "0.43.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "The model every core and client shares: sessions, views, tabs, channels, options' and events' shape, a tab's saved state, and the pure queries over them."
[dependencies]
pumi-api = { path = "../pumi-api" }
pumi-layout = { path = "../pumi-layout" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
schemars = "=1.2.3"
sha2 = "=0.11.1"
base64 = "=0.23.1"
[dev-dependencies]
tempfile = "=3.27.0"

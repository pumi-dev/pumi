[package]
name = "gpui_apple"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# Its own workspace, so the root one (whose directory it is in) does not take it as a member.
[workspace]

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lib]
path = "src/gpui_apple.rs"

[features]
default = []
test-support = ["gpui/test-support"]
runtime_shaders = []

[dependencies]
gpui = { git = "https://github.com/remorses/zed.git", rev = "f77e5cfe9dad04288566f00c66ecf3c58d6f84b3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
anyhow = "1.0.86"
block = "0.1"
cocoa = "=0.26.0"
collections = { git = "https://github.com/remorses/zed.git", rev = "f77e5cfe9dad04288566f00c66ecf3c58d6f84b3" }
core-foundation = "0.10"
core-video = { version = "0.5.2", features = ["metal"] }
derive_more = { version = "2.1.1", features = ["add", "add_assign", "deref", "deref_mut", "display", "from", "from_str", "mul", "mul_assign", "not"] }
etagere = "0.2"
foreign-types = "0.5"
image = { version = "0.25.1", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"] }
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
metal = "0.33"
objc = "0.2"
parking_lot = "0.12.1"

[target.'cfg(target_os = "macos")'.build-dependencies]
cbindgen = { version = "0.28.0", default-features = false }
gpui = { git = "https://github.com/remorses/zed.git", rev = "f77e5cfe9dad04288566f00c66ecf3c58d6f84b3", default-features = false }

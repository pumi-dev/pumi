<svg xmlns="http://www.w3.org/2000/svg" width="336" height="160" viewBox="0 0 336 160">
  <!-- The default theme (DARK tokens in runtime/app/sdk/theme.ts): the side bar, then two panes. -->
  <rect width="336" height="160" fill="#1e1f22"/>

  <!-- Side bar: surface, its border on the right. -->
  <rect width="96" height="160" fill="#26282b"/>
  <rect x="96" width="1" height="160" fill="#393b41"/>
  <circle cx="10" cy="9" r="3" fill="#ff5f57"/>
  <circle cx="20" cy="9" r="3" fill="#febc2e"/>
  <circle cx="30" cy="9" r="3" fill="#28c840"/>
  <rect y="18" width="96" height="1" fill="#393b41"/>
  <!-- The session's name. -->
  <rect x="10" y="27" width="40" height="5" rx="2.5" fill="#dfe1e5"/>
  <!-- Its views, one picked, with agents' status dots. -->
  <rect x="6" y="39" width="84" height="14" rx="4" fill="#494a4d"/>
  <circle cx="14" cy="46" r="2.5" fill="#89b4fa"/>
  <rect x="21" y="44" width="44" height="4" rx="2" fill="#dfe1e5"/>
  <circle cx="14" cy="60" r="2.5" fill="#a6e3a1"/>
  <rect x="21" y="58" width="52" height="4" rx="2" fill="#b0b1b3"/>
  <circle cx="14" cy="74" r="2.5" fill="#fab387"/>
  <rect x="21" y="72" width="36" height="4" rx="2" fill="#b0b1b3"/>
  <circle cx="14" cy="88" r="2.5" fill="#9399b2"/>
  <rect x="21" y="86" width="46" height="4" rx="2" fill="#b0b1b3"/>
  <!-- A second session, folded. -->
  <rect x="10" y="104" width="32" height="4" rx="2" fill="#888a8f"/>
  <rect x="10" y="116" width="26" height="4" rx="2" fill="#888a8f"/>
  <!-- The buttons at its foot. -->
  <rect y="141" width="96" height="1" fill="#393b41"/>
  <rect x="10" y="148" width="8" height="6" rx="2" fill="#888a8f"/>
  <rect x="24" y="148" width="8" height="6" rx="2" fill="#888a8f"/>
  <rect x="38" y="148" width="8" height="6" rx="2" fill="#888a8f"/>

  <!-- Left pane: its tab strip, the front tab open onto the terminal. -->
  <rect x="97" width="119" height="18" fill="#26282b"/>
  <rect x="97" y="17" width="119" height="1" fill="#393b41"/>
  <rect x="97" width="58" height="18" fill="#1e1f22"/>
  <rect x="155" width="1" height="18" fill="#393b41"/>
  <rect x="104" y="7" width="40" height="4" rx="2" fill="#dfe1e5"/>
  <rect x="162" y="7" width="34" height="4" rx="2" fill="#888a8f"/>
  <!-- An agent's transcript. -->
  <rect x="104" y="28" width="6" height="4" rx="1" fill="#3474f0"/>
  <rect x="114" y="28" width="70" height="4" rx="2" fill="#dfe1e5"/>
  <rect x="104" y="40" width="94" height="4" rx="2" fill="#b0b1b3"/>
  <rect x="104" y="48" width="80" height="4" rx="2" fill="#b0b1b3"/>
  <rect x="104" y="56" width="88" height="4" rx="2" fill="#b0b1b3"/>
  <rect x="104" y="68" width="30" height="4" rx="2" fill="#a6e3a1"/>
  <rect x="138" y="68" width="50" height="4" rx="2" fill="#888a8f"/>
  <rect x="104" y="76" width="42" height="4" rx="2" fill="#cc6666"/>
  <rect x="150" y="76" width="36" height="4" rx="2" fill="#888a8f"/>
  <rect x="104" y="88" width="76" height="4" rx="2" fill="#b0b1b3"/>
  <rect x="104" y="96" width="60" height="4" rx="2" fill="#b0b1b3"/>
  <!-- Its prompt. -->
  <rect x="102" y="134" width="108" height="18" rx="4" fill="none" stroke="#393b41"/>
  <rect x="108" y="141" width="3" height="5" fill="#dfe1e5"/>

  <!-- The split between the panes. -->
  <rect x="216" width="1" height="160" fill="#393b41"/>

  <!-- Right pane: a shell. -->
  <rect x="217" width="119" height="18" fill="#26282b"/>
  <rect x="217" y="17" width="119" height="1" fill="#393b41"/>
  <rect x="217" width="64" height="18" fill="#1e1f22"/>
  <rect x="281" width="1" height="18" fill="#393b41"/>
  <rect x="224" y="7" width="44" height="4" rx="2" fill="#dfe1e5"/>
  <rect x="224" y="28" width="8" height="4" rx="1" fill="#a6e3a1"/>
  <rect x="236" y="28" width="46" height="4" rx="2" fill="#dfe1e5"/>
  <rect x="224" y="36" width="84" height="4" rx="2" fill="#888a8f"/>
  <rect x="224" y="44" width="70" height="4" rx="2" fill="#888a8f"/>
  <rect x="224" y="52" width="92" height="4" rx="2" fill="#888a8f"/>
  <rect x="224" y="60" width="24" height="4" rx="2" fill="#a6e3a1"/>
  <rect x="252" y="60" width="40" height="4" rx="2" fill="#888a8f"/>
  <rect x="224" y="72" width="8" height="4" rx="1" fill="#a6e3a1"/>
  <rect x="236" y="72" width="3" height="5" fill="#dfe1e5"/>
</svg>
